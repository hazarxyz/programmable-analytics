name: Dune queries

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'queries/**'
      - 'scripts/**'
      - 'tests/**'
      - 'dune.json'
      - '.github/workflows/dune.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Verify saved SQL or publish the current main branch
        type: choice
        options: [verify, push]
        default: verify
        required: true

permissions:
  contents: read

concurrency:
  group: dune-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/dune.py check
      - run: python3 -m unittest discover -s tests -v

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check API configuration
        if: env.DUNE_API_KEY == ''
        run: echo '::notice::Dune synchronization is not configured. Add the DUNE_API_KEY repository secret.'
      - name: Synchronize query SQL
        if: env.DUNE_API_KEY != ''
        env:
          OPERATION: ${{ inputs.operation || 'push' }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            python3 scripts/dune.py push --base-ref "$BASE_SHA"
          else
            python3 scripts/dune.py "$OPERATION"
          fi

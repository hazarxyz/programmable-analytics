name: Dune queries

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'queries/**'
      - 'scripts/**'
      - 'tests/**'
      - 'dune.json'
      - '.github/workflows/dune.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Verify, export live SQL, or publish the current main branch
        type: choice
        options: [verify, pull, push]
        default: verify
        required: true

permissions:
  contents: read

concurrency:
  group: dune-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/dune.py check
      - run: python3 -m unittest discover -s tests -v

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check API configuration
        if: env.DUNE_API_KEY == ''
        run: echo '::notice::Dune synchronization is not configured. Add the DUNE_API_KEY repository secret.'
      - name: Synchronize query SQL
        if: env.DUNE_API_KEY != ''
        env:
          OPERATION: ${{ inputs.operation || 'push' }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            python3 scripts/dune.py push --base-ref "$BASE_SHA"
          else
            python3 scripts/dune.py "$OPERATION"
          fi
      - name: Export current Dune SQL
        if: inputs.operation == 'pull' && env.DUNE_API_KEY != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dune-query-source
          path: queries/*.sql
          retention-days: 7
          if-no-files-found: error
